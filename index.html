<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الروان الذكي</title>
    <style>
        body { margin: 0; background: #0b0e14; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* تصميم الأفاتار المتحرك */
        #avatar-container { position: relative; width: 220px; height: 220px; border-radius: 50%; border: 4px solid #00d4ff; box-shadow: 0 0 20px #00d4ff; overflow: hidden; margin-bottom: 20px; transition: 0.3s; }
        #avatar-img { width: 100%; height: 100%; object-fit: cover; }

        /* حركة الأفاتار أثناء الكلام */
        .talking { animation: mouthMove 0.4s infinite alternate, pulse Glow 1.5s infinite; border-color: #ff0055 !important; box-shadow: 0 0 30px #ff0055 !important; }
        
        @keyframes mouthMove { from { transform: scale(1); } to { transform: scale(1.08); } }
        @keyframes pulseGlow { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        #display-text { font-size: 1.2rem; color: #00d4ff; text-align: center; margin-bottom: 20px; min-height: 40px; }
        .controls { display: flex; gap: 10px; width: 90%; max-width: 400px; }
        input { flex: 1; padding: 15px; border-radius: 25px; border: none; outline: none; font-size: 1rem; }
        button { padding: 10px 25px; border-radius: 25px; border: none; background: #00d4ff; color: #0b0e14; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="avatar-container">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=b6e3f4" id="avatar-img">
    </div>

    <div id="display-text">هلا بيك علي.. أنا أسمعك.</div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="سولف وياي...">
        <button onclick="processAI()">إرسال</button>
    </div>

    <script>
        function processAI() {
            const text = document.getElementById('userInput').value;
            const container = document.getElementById('avatar-container');
            const display = document.getElementById('display-text');

            if (!text) return;

            // بدء الحركة (الأفاتار يبدأ يهتز وينبض)
            container.classList.add('talking');
            display.innerText = "جاري المعالجة...";

            // تحويل النص إلى صوت (يحجي)
            const speech = new SpeechSynthesisUtterance();
            speech.text = "تم يا بطل، سجلت عندي: " + text;
            speech.lang = 'ar-SA'; // لغة عربية برنة واضحة
            speech.rate = 1.0;
            
            // إنهاء الحركة عند سكوت الصوت
            speech.onend = () => {
                container.classList.remove('talking');
                display.innerText = "تم الحفظ بذاكرتي!";
                document.getElementById('userInput').value = "";
            };

            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
